<g id="achievement-1" transform="translate(0 {{yPos}})" data-state="unlocked">
    <rect x="74" y="88" width="705" height="108" rx="17" fill="#C7EFF7"/>

    <circle cx="120.5" cy="141.5" r="46.5" fill="#D9D9D9"/>

    <!-- Replace {{icon1}} with an image URL/data URI -->
    <image
      id="achievement-1-icon"
      xlink:href="{{icon1}}"
      x="74"
      y="95"
      width="93"
      height="93"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#iconClip1)"
    />

    <text
      id="achievement-1-name"
      x="174"
      y="130"
      font-family="Inter, Arial, sans-serif"
      font-size="36"
      font-weight="400"
      fill="#000000"
    >{{name1}}</text>

    <text
      id="achievement-1-description"
      x="174"
      y="153"
      font-family="Inter, Arial, sans-serif"
      font-size="25"
      font-weight="400"
      fill="#000000"
    >{{description1}}</text>
</g>

  