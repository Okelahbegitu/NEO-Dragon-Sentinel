<g id="achievement-2" transform="translate(0 {{yPos}})" data-state="locked">
    <rect x="74" y="88" width="705" height="108" rx="17" fill="#212627"/>

    <circle cx="120.5" cy="141.5" r="46.5" fill="#3A3636"/>

    <!-- Replace {{icon2}} with an image URL/data URI -->
    <image
      id="achievement-2-icon"
      xlink:href="{{icon2}}"
      x="74"
      y="95"
      width="93"
      height="93"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#iconClip2)"
    />

    <text
      id="achievement-2-name"
      x="174"
      y="130"
      font-family="Inter, Arial, sans-serif"
      font-size="36"
      font-weight="400"
      fill="#8A7B7B"
    >{{name2}}</text>

    <text
      id="achievement-2-description"
      x="174"
      y="153"
      font-family="Inter, Arial, sans-serif"
      font-size="25"
      font-weight="400"
      fill="#8A7B7B"
    >{{description2}}</text>
</g>
